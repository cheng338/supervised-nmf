[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supervised-nmf"
version = "0.4.0"
description = "Supervised nonnegative matrix factorization for binary classification"
readme = "README.md"
license = "LicenseRef-All-Rights-Reserved AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.6,<2", "threadpoolctl>=3.1", "joblib>=1.3"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["Pillow>=10"]
study = ["Pillow>=10", "matplotlib>=3.8"]
test = ["pytest>=9.0"]

[project.urls]
Repository = "https://github.com/cheng338/supervised-nmf"
Issues = "https://github.com/cheng338/supervised-nmf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

