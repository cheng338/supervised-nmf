[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supervised-nmf"
version = "0.6.1"
description = "Supervised nonnegative matrix factorization for binary classification"
readme = {text = """
Supervised NMF for binary classification combines training-only feature
screening with a nonnegative representation and a KNN, logistic regression,
or linear SVM classifier. The scikit-learn-style API supports fitting,
prediction, and calibration within training folds.

Install the downloaded wheel with Python 3.11 or later:

```sh
python -m pip install ./supervised_nmf-0.6.1-py3-none-any.whl
```

For finite, nonnegative feature matrices and two training classes:

```python
from supervised_nmf import NMFClassifier

model = NMFClassifier().fit(X_train, y_train)
predictions = model.predict(X_test)
```

Tune screening, rank and classifier settings within training folds before
evaluating the fitted procedure on held-out observations. The constructor
defaults are starting values.

The [0.6.1 README](https://github.com/cheng338/supervised-nmf/blob/v0.6.1/README.md)
and [API guide](https://github.com/cheng338/supervised-nmf/blob/v0.6.1/docs/api.md)
give worked examples and tuning guidance. The matching source archive includes
both documents for offline use. Other versions are available on the
[releases page](https://github.com/cheng338/supervised-nmf/releases).

Chang Cheng developed the method in Chapter 7 of his Purdue dissertation.
His original work is All Rights Reserved. See the bundled LICENSE and
THIRD_PARTY_NOTICES for the applicable terms.
""", content-type = "text/markdown"}
license = "LicenseRef-All-Rights-Reserved AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = ["numpy>=1.26.3", "scipy>=1.15.0,!=1.16.0,!=1.16.1", "scikit-learn>=1.9.0", "threadpoolctl>=3.7.0", "joblib>=1.6.0"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["Pillow>=13.0.0"]
study = [
  "Pillow>=13.0.0",
  "matplotlib>=3.7.3; python_version < '3.13'",
  "matplotlib>=3.9.2; python_version == '3.13'",
  "matplotlib>=3.10.5; python_version == '3.14'",
  "matplotlib>=3.11.2; python_version >= '3.15'",
]
test = [
  "pytest>=9.0.3,!=9.1.0",
  "pandas>=2.1.2; python_version < '3.13'",
  "pandas>=2.2.3; python_version == '3.13'",
  "pandas>=2.3.3; python_version == '3.14'",
  "pandas>=3.0.6; python_version >= '3.15'",
]

[project.urls]
Repository = "https://github.com/cheng338/supervised-nmf"
Issues = "https://github.com/cheng338/supervised-nmf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

markers = [
  "archived_qualification: positive qualification requiring the original frozen study source/runtime and explicit opt-in",
]
