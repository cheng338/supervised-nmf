[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervised-nmf"
version = "0.1.0"
description = "Supervised nonnegative matrix factorization for binary classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chang Cheng"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.6,<2", "threadpoolctl>=3.1"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["Pillow>=10"]
study = ["Pillow>=10", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/cheng338/supervised-nmf"
Issues = "https://github.com/cheng338/supervised-nmf/issues"

[tool.setuptools.packages.find]
where = ["src"]

